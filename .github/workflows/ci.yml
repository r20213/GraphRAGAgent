name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify lazy package imports have no eager side effects
        # Importing the packages must NOT pull in neo4j/mcp/dotenv.
        run: |
          python - <<'PY'
          import sys
          import mcp_server
          import utils
          heavy = {"neo4j", "mcp", "dotenv"}
          loaded = heavy & set(sys.modules)
          assert not loaded, f"Eager import detected: {loaded}"
          print("OK: packages import without heavy dependencies")
          PY

      - name: Run unit tests
        run: pytest -ra -q

      - name: Smoke-check server module import
        # Full import including third-party deps should succeed.
        run: python -c "from mcp_server import mcp, main; print('server import OK')"

  smoke-http:
    name: Streamable-HTTP smoke test
    runs-on: ubuntu-latest
    needs: test
    env:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 127.0.0.1
      MCP_PORT: "8000"
      # Public read-only Neo4j demo database.
      NEO4J_URI: neo4j+s://demo.neo4jlabs.com
      NEO4J_USERNAME: companies
      NEO4J_PASSWORD: companies
      NEO4J_DATABASE: companies
      NEO4J_READ_ONLY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start MCP server (streamable-http)
        run: |
          python mcp_server/server.py &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server to become healthy
        run: |
          for i in $(seq 1 30); do
            if python mcp_server/healthcheck.py; then
              echo "Server is healthy."
              exit 0
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done
          echo "Server did not become healthy in time." >&2
          exit 1

      - name: Call a tool over streamable-http
        run: |
          python - <<'PY'
          import asyncio
          from mcp import ClientSession
          from mcp.client.streamable_http import streamablehttp_client

          async def main():
              url = "http://127.0.0.1:8000/mcp"
              async with streamablehttp_client(url) as (read, write, _):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      names = {t.name for t in tools.tools}
                      print("Discovered tools:", sorted(names))
                      assert "get_industries" in names, names
                      result = await session.call_tool("get_industries", {})
                      text = result.content[0].text
                      assert text, "empty tool response"
                      print("get_industries returned", len(text), "chars")

          asyncio.run(main())
          PY

      - name: Stop MCP server
        if: always()
        run: kill "$SERVER_PID" || true
