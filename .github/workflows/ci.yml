name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify lazy package imports have no eager side effects
        # Importing the packages must NOT pull in neo4j/mcp/dotenv.
        run: |
          python - <<'PY'
          import sys
          import mcp_server
          import utils
          heavy = {"neo4j", "mcp", "dotenv"}
          loaded = heavy & set(sys.modules)
          assert not loaded, f"Eager import detected: {loaded}"
          print("OK: packages import without heavy dependencies")
          PY

      - name: Run unit tests
        run: pytest -ra -q

      - name: Smoke-check server module import
        # Full import including third-party deps should succeed.
        run: python -c "from mcp_server import mcp, main; print('server import OK')"
