version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  root-agent:
    build:
      context: ..
      dockerfile: root_agent/Dockerfile
    command: python -m root_agent --a2a
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "8080:8080"

  root-agent-worker:
    build:
      context: ..
      dockerfile: root_agent/Dockerfile
    command: python -m root_agent.worker
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis